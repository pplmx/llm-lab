name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            platforms: linux/amd64,linux/arm64
          - os: macos-latest
            artifact: macos
            platforms: darwin/universal
          - os: windows-latest
            artifact: windows
            platforms: windows/amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 三端全量打包：deb / tar.gz / PKGBUILD、NSIS 安装包、.dmg
      - name: 打包
        shell: bash
        run: go tool mygo build -platform "${{ matrix.platforms }}"

      - name: 压缩 .app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/darwin-universal/LLM Lab.app" \
            "build/LLM-Lab-${GITHUB_REF_NAME}-macos-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: llm-lab-${{ matrix.artifact }}
          path: build/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 上传到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.tar.gz
            dist/**/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
