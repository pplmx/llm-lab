name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 GTK3（Linux 运行 UI 测试需要）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod 是否 tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -timeout 300s ./...

      # Only internal/model has goroutines: the matrix multiply and the
      # per-head attention loop fan out with sync.WaitGroup. internal/app is
      # single-threaded UI code, and under the race detector one rendered frame
      # costs 24ms instead of 0.8ms — the app package alone takes 11 minutes,
      # past Go's 10-minute default test timeout, which is what this step used to
      # hit. Racing the package that has no concurrency bought nothing and cost
      # the whole job.
      - name: go test -race（Linux，仅并发包）
        if: runner.os == 'Linux'
        run: go test -race -timeout 300s ./internal/model/

      - name: go test GOEXPERIMENT=simd（Linux，实验性 SIMD 内核）
        if: runner.os == 'Linux'
        run: GOEXPERIMENT=simd go test -timeout 300s ./...

  build:
    name: build (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            platforms: linux/amd64,linux/arm64
          - os: macos-latest
            artifact: macos
            platforms: darwin/universal
          - os: windows-latest
            artifact: windows
            platforms: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建
        shell: bash
        run: go tool mygo build -platform "${{ matrix.platforms }}" -skip-installer

      - uses: actions/upload-artifact@v4
        with:
          name: llm-lab-${{ matrix.artifact }}
          path: build/
          if-no-files-found: error
          retention-days: 7
