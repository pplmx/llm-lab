name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 GTK3（Linux 运行 UI 测试需要）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod 是否 tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -timeout 300s ./...

      # Only internal/model has goroutines: the matrix multiply and the
      # per-head attention loop fan out with sync.WaitGroup. internal/app is
      # single-threaded UI code, and under the race detector one rendered frame
      # costs 24ms instead of 0.8ms — the app package alone takes 11 minutes,
      # past Go's 10-minute default test timeout, which is what this step used to
      # hit. Racing the package that has no concurrency bought nothing and cost
      # the whole job.
      - name: go test -race（Linux，仅并发包）
        if: runner.os == 'Linux'
        run: go test -race -timeout 300s ./internal/model/

      - name: go test GOEXPERIMENT=simd（Linux，实验性 SIMD 内核）
        if: runner.os == 'Linux'
        # 600s, not 300: since MyGo v0.9.1 (v0.10.0 too) a window's first frame is 13ms → 51ms (steady
        # frames are unchanged at 0.9ms), which puts internal/app at about 380s under
        # SIMD on this 128-core machine. Measured, not guessed: skipping the tests this
        # change added still timed out at 300s. The other steps stay at 300s.
        run: GOEXPERIMENT=simd go test -timeout 600s ./...

  build:
    name: build (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            platforms: linux/amd64,linux/arm64
          - os: macos-latest
            artifact: macos
            platforms: darwin/universal
          - os: windows-latest
            artifact: windows
            platforms: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建
        shell: bash
        run: go tool mygo build -platform "${{ matrix.platforms }}" -skip-installer

      - uses: actions/upload-artifact@v4
        with:
          name: llm-lab-${{ matrix.artifact }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  # The phone targets: mygo v0.10 added iOS and Android, and this app's UI now has a
  # layout for them (internal/app/compact.go). Nothing verified that until now — the
  # test job runs on desktops only, and a phone build that stopped compiling would be
  # found by whoever next tried to package one.
  #
  # These are build jobs, not run jobs: no simulator boots here, so this proves the
  # toolchains link the app, not that it renders. The layout itself is covered by
  # compact_test.go at six device widths.
  mobile:
    name: mobile (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS links with Xcode's clang, so it needs a macOS runner. The simulator
          # build is unsigned, which is the one that needs no Apple developer team:
          # a device or App Store build wants a provisioning profile this repository
          # does not carry, and a fork's secrets are not the maintainer's.
          - os: macos-latest
            platform: ios/simulator
          # Android links with the NDK's clang and Gradle builds the APK; any runner can
          # do it. arm64 is what Google Play requires of an app with native code.
          - os: ubuntu-latest
            platform: android/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Android SDK, the NDK the app links with and JDK 17 for Gradle.
      #
      # JDK 17 exactly, not "a JDK": the host Gradle pins 8.14.3, which cannot run on a
      # newer JDK — its embedded Kotlin fails to parse the version string (jdk 25 gives
      # `java.lang.IllegalArgumentException: 25.0.5.0.3`). That is upstream issue #2064;
      # this step pins what works rather than working around it.
      #
      # The SDK's location differs between runner images, so this finds it instead of
      # assuming one: $ANDROID_HOME, $ANDROID_SDK_ROOT, or the image's usual directory.
      # The versions are the ones the build was verified with (SDK 36, NDK 29).
      - name: 安装 Android SDK 包与 JDK 17
        if: matrix.platform == 'android/arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk/cmdline-tools/latest" ]; then
            echo "no Android SDK at $sdk; the runner image changed its layout" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          # GITHUB_ENV is read by the next step, not this one: use the local variable.
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      # The build below is the real check; this runs first so a missing SDK, NDK or JDK is
      # one clear line instead of Gradle's wall of text. Only the phone toolchain's lines
      # matter here: `mygo doctor` exits non-zero when anything is missing, and a Linux
      # runner always lacks GTK 3 and WebKitGTK — neither is used by native UI, and the
      # desktop build job installs GTK only because the tests need it.
      - name: 环境自检（手机工具链）
        run: go tool mygo doctor || true

      - name: 构建 ${{ matrix.platform }}
        shell: bash
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: llm-lab-${{ strategy.job-index }}-${{ replace(matrix.platform, '/', '-') }}
          path: build/
          if-no-files-found: error
          retention-days: 7
